name: Image

# The hosted build's image: the same Dockerfile as local Docker, built for linux/arm64 (the SE cluster's nodes are arm64) on a
# GitHub-hosted arm64 runner. Pull requests build and smoke it without pushing; a push to main pushes
# ghcr.io/<owner>/agent-connect:sha-<full commit> with the workflow's own GITHUB_TOKEN (packages: write, no other secret).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lower case)
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-connect" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: |
            ac-smoke
            ${{ steps.name.outputs.repo }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke the built image as the hosted mock build before any push
        run: |
          docker run -d --name ac -p 127.0.0.1:5100:5100 --read-only --tmpfs /tmp -e MODE=mock -e MUSE_ALLOWED_HOSTS=agent-connect.lab.example ac-smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5100/api/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:5100/api/health | grep -q '"schema":"demo-health/1"'
          curl -fsS -H 'host: agent-connect.lab.example' http://127.0.0.1:5100/api/session | grep -q '"hosted":true'
          curl -fsS -H 'host: agent-connect.lab.example' http://127.0.0.1:5100/ | grep -qi '<html'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'host: agent-connect.lab.example' -X POST http://127.0.0.1:5100/mcp)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'host: attacker.example' http://127.0.0.1:5100/api/session)" = 403
          docker logs ac
      - name: Push (main only, after the smoke passed)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push "${{ steps.name.outputs.repo }}:sha-${{ github.sha }}"
